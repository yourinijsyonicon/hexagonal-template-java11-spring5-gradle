buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "io.spring.gradle:dependency-management-plugin:1.1.6"
    }
}

plugins {
    id "java"
    id "jacoco"

    id "org.springframework.boot" version "2.7.18" apply false
    id "io.freefair.lombok" version "8.14.4" apply false
    id "com.gorylenko.gradle-git-properties" version "2.5.4" apply false
    id "com.github.johnrengelman.shadow" version "8.1.1" apply false
}

tasks.register('printVersion') {
    doLast {
        println project.version
    }
}

def jacocoExclusion = ["**/be/yonicon/hexagonal/rdbms/jooq/**",
                       "**/be/yonicon/hexagonal/test/**",
                       "**/be/yonicon/hexagonal/sanity/**",
                       "**/be/yonicon/hexagonal/**/config/**"]

allprojects {
    repositories {
        mavenCentral()
    }

    group = 'be.yonicon.template-java11-spring5-gradle'
    version = System.getenv('CI_COMMIT_SHORT_SHA') != null ? System.getenv('CI_COMMIT_SHORT_SHA').substring(0, 7) : 'local'
}

subprojects {
    apply plugin: 'maven-publish'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'java-library'

    java.sourceCompatibility = JavaVersion.VERSION_11
    java.targetCompatibility = JavaVersion.VERSION_11

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from(components.java)
            }
        }
    }

    tasks.named("test") {
        useJUnitPlatform {
            excludeTags "slow-test"
        }
        testLogging {
            events "passed", "skipped", "failed"
        }
        jacoco {
            excludes = jacocoExclusion
        }
    }

    tasks.register("slowTest", Test) {
        useJUnitPlatform {
            includeTags "slow-test"
        }
        testLogging {
            events "passed", "skipped", "failed"
        }
        jacoco {
            excludes = jacocoExclusion
        }
        shouldRunAfter test
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:2.7.18'
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.6"
        }
        dependencies {
            dependency 'io.micrometer:micrometer-tracing-bridge-otel:1.6.4'
            dependency 'net.logstash.logback:logstash-logback-encoder:9.0'
            dependency 'org.springdoc:springdoc-openapi-ui:1.8.0'
        }
    }

    dependencies {
        implementation 'org.slf4j:slf4j-api'

        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.assertj:assertj-core'
    }
}